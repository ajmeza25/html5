```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Usuario</title>

    <style>
        /* ==============================
           ESTILOS GENERALES
        ============================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            color: #222;
        }

        /* ==============================
           ENCABEZADO
        ============================== */

        header {
            background-color: #4f46e5;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0 0 20px;
            font-size: 35px;
            font-weight: bold;
            text-decoration: underline;
        }

        /* ==============================
           MENÚ
        ============================== */

        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            font-weight: bold;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
        }

        nav a:hover {
            background-color: #3730a3;
            text-decoration: underline;
        }

        nav button {
            background-color: #facc15;
            color: #222;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        nav button:hover {
            background-color: #fde047;
        }

        /* ==============================
           CONTENIDO PRINCIPAL
        ============================== */

        main {
            width: 90%;
            max-width: 850px;
            margin: 35px auto;
        }

        /* ==============================
           SECCIONES
        ============================== */

        .seccion,
        .subseccion {
            background-color: white;
            padding: 30px;
            margin-bottom: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.15);
        }

        h2 {
            color: #4f46e5;
            text-align: center;
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 25px;
        }

        /* ==============================
           ETIQUETAS
        ============================== */

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            color: #312e81;
            font-weight: bold;
            text-decoration: underline;
        }

        /* ==============================
           CAMPOS
        ============================== */

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #c7d2fe;
            border-radius: 7px;
            font-size: 16px;
            background-color: #f8fafc;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #4f46e5;
            background-color: white;
            box-shadow: 0 0 5px rgba(79, 70, 229, 0.3);
        }

        textarea {
            resize: vertical;
        }

        /* ==============================
           GÉNERO
        ============================== */

        fieldset {
            margin-top: 20px;
            padding: 20px;
            border: 2px solid #c7d2fe;
            border-radius: 8px;
        }

        legend {
            color: #312e81;
            font-weight: bold;
            text-decoration: underline;
        }

        .radio-label {
            display: inline-block;
            margin-right: 25px;
            text-decoration: none;
            font-weight: normal;
            color: #222;
        }

        .radio-label input {
            margin-right: 5px;
        }

        /* ==============================
           CHECKBOX
        ============================== */

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #312e81;
            font-weight: bold;
            text-decoration: underline;
        }

        .checkbox-label input {
            width: 18px;
            height: 18px;
        }

        /* ==============================
           BOTONES
        ============================== */

        .botones {
            text-align: center;
            margin-top: 30px;
        }

        .botones button {
            padding: 13px 25px;
            margin: 5px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .botones button[type="submit"] {
            background-color: #4f46e5;
            color: white;
        }

        .botones button[type="submit"]:hover {
            background-color: #3730a3;
        }

        .botones button[type="reset"] {
            background-color: #ef4444;
            color: white;
        }

        .botones button[type="reset"]:hover {
            background-color: #dc2626;
        }

        /* ==============================
           PIE DE PÁGINA
        ============================== */

        footer {
            background-color: #312e81;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        footer p {
            margin: 0;
            font-weight: bold;
        }

        /* ==============================
           CELULARES
        ============================== */

        @media (max-width: 600px) {

            header h1 {
                font-size: 27px;
            }

            nav {
                flex-direction: column;
            }

            nav a,
            nav button {
                width: 100%;
            }

            main {
                width: 95%;
            }

            .seccion,
            .subseccion {
                padding: 20px;
            }

            .radio-label {
                display: block;
                margin-bottom: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- ENCABEZADO -->
    <header>

        <h1>Registro de Usuario</h1>

        <!-- MENÚ DE NAVEGACIÓN -->
        <nav>
            <a href="#personal">Información Personal</a>
            <a href="#contacto">Contacto</a>
            <a href="#cuenta">Cuenta</a>
            <a href="#preferencias">Preferencias</a>

            <button type="button"
                onclick="window.location.href='#registro'">
                Registrarse
            </button>
        </nav>

    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main id="registro">

        <!-- PRIMERA SECCIÓN -->
        <section class="seccion" id="personal">

            <h2>Información Personal</h2>

            <form action="#" method="post">

                <!-- NOMBRE -->
                <label for="nombre">
                    Nombre:
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Escribe tu nombre"
                    required
                >


                <!-- APELLIDO -->
                <label for="apellido">
                    Apellido:
                </label>

                <input
                    type="text"
                    id="apellido"
                    name="apellido"
                    placeholder="Escribe tu apellido"
                    required
                >


                <!-- FECHA DE NACIMIENTO -->
                <label for="fecha">
                    Fecha de Nacimiento:
                </label>

                <input
                    type="date"
                    id="fecha"
                    name="fecha"
                    required
                >


                <!-- GÉNERO -->
                <fieldset>

                    <legend>Género:</legend>

                    <label class="radio-label">
                        <input
                            type="radio"
                            name="genero"
                            value="masculino"
                            required
                        >
                        Masculino
                    </label>

                    <label class="radio-label">
                        <input
                            type="radio"
                            name="genero"
                            value="femenino"
                        >
                        Femenino
                    </label>

                    <label class="radio-label">
                        <input
                            type="radio"
                            name="genero"
                            value="otro"
                        >
                        Otro
                    </label>

                </fieldset>


                <!-- SEGUNDA SECCIÓN -->
                <section class="subseccion" id="contacto">

                    <h2>Información de Contacto</h2>

                    <!-- CORREO -->
                    <label for="correo">
                        Dirección de Correo Electrónico:
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        required
                    >


                    <!-- TELÉFONO -->
                    <label for="telefono">
                        Número de Teléfono:
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        placeholder="10 dígitos"
                        required
                    >


                    <!-- DIRECCIÓN -->
                    <label for="direccion">
                        Dirección:
                    </label>

                    <textarea
                        id="direccion"
                        name="direccion"
                        rows="4"
                        placeholder="Escribe tu dirección"
                    ></textarea>


                    <!-- INFORMACIÓN DE CUENTA -->
                    <h2 id="cuenta">
                        Información de Cuenta
                    </h2>


                    <!-- USUARIO -->
                    <label for="usuario">
                        Nombre de Usuario:
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Crea un nombre de usuario"
                        required
                    >


                    <!-- CONTRASEÑA -->
                    <label for="password">
                        Contraseña:
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Crea una contraseña"
                        required
                    >


                    <!-- CONFIRMAR CONTRASEÑA -->
                    <label for="confirmar">
                        Confirmación de Contraseña:
                    </label>

                    <input
                        type="password"
                        id="confirmar"
                        name="confirmar"
                        placeholder="Confirma tu contraseña"
                        required
                    >


                    <!-- PREFERENCIAS -->
                    <h2 id="preferencias">
                        Preferencias
                    </h2>


                    <!-- COLOR FAVORITO -->
                    <label for="color">
                        Color Favorito:
                    </label>

                    <select id="color" name="color">

                        <option value="">
                            Selecciona un color
                        </option>

                        <option value="rojo">
                            Rojo
                        </option>

                        <option value="azul">
                            Azul
                        </option>

                        <option value="verde">
                            Verde
                        </option>

                        <option value="amarillo">
                            Amarillo
                        </option>

                    </select>


                    <!-- TÉRMINOS -->
                    <label class="checkbox-label">

                        <input
                            type="checkbox"
                            id="terminos"
                            name="terminos"
                            required
                        >

                        Acepto los Términos y Condiciones

                    </label>


                    <!-- BOTONES -->
                    <div class="botones">

                        <button type="submit">
                            Crear Cuenta
                        </button>

                        <button type="reset">
                            Limpiar
                        </button>

                    </div>

                </section>

            </form>

        </section>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer>

        <p>
            &copy; 2026 Registro de Usuario |
            Todos los derechos reservados.
        </p>

    </footer>

</body>

</html>
```
